apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: pipelineproof
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [demo]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: pipelineproof
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: pipelineproof
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
