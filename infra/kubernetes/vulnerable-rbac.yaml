# INTENTIONALLY VULNERABLE. Only apply to the dedicated kind-pipelineproof context.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: pipelineproof
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: pipelineproof
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: pipelineproof
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
