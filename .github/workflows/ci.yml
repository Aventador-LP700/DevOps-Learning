name: Validate PipelineProof
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test native setup and API without Docker
        run: python3 -m unittest discover -s tests -v
      - name: Generate native evidence without Docker
        run: bash ./setup.sh --lab-only --output reports/native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipelineproof-native-evidence
          path: reports/native/assessment.*
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Unit checks
        run: make check
      - name: Reproduce attacks and verify controls
        run: make lab
      - name: Export assessment
        if: always()
        run: make report
      - name: Smoke test deployment
        run: |
          make up
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8080/health
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipelineproof-evidence
          path: reports/assessment.*
          if-no-files-found: warn
          retention-days: 14
      - name: Clean up
        if: always()
        run: make clean

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 -m unittest discover -s tests -p browser_labs.py -v
  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: pipx install semgrep==1.185.0
      - run: python3 -m scripts.sast
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sast-evidence
          path: reports/semgrep-*
