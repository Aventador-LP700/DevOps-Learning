name: Kubernetes RBAC integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rbac:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kind (version pinned, checksum verified)
        run: |
          curl -fsSLo kind-linux-amd64 https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          echo "517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889  kind-linux-amd64" | sha256sum --check
          chmod +x kind-linux-amd64
          sudo mv kind-linux-amd64 /usr/local/bin/kind
      - run: make k8s-up k8s-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: kubernetes-rbac-evidence
          path: reports/rbac*
      - run: make k8s-down
        if: always()
